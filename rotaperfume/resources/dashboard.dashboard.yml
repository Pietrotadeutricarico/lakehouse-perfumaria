# O dashboard como CODIGO.
#
# Dashboard clicado nao tem diff, nao tem revisao e nao tem rollback: se
# alguem apaga um widget na sexta, ninguem sabe o que tinha la. Aqui ele e'
# um arquivo JSON versionado no Git, que sobe junto com o deploy -- e volta
# identico se alguem deletar pela interface.
#
# dataset_catalog e dataset_schema sao o que permite as queries do JSON
# usarem nome de tabela PURO (`FROM fato_vendas`). Se o JSON prefixasse o
# catalogo, estes dois campos seriam ignorados e o dashboard deixaria de
# ser portavel entre ambientes.

resources:
  dashboards:
    dashboard_comercial:
      display_name: RotaPerfume - Painel Comercial
      file_path: ../resources/dashboard-comercial.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold
